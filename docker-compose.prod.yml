# Production compose — uses pre-built Docker Hub images, no source bind mounts.
# Usage on server: docker compose -f docker-compose.prod.yml --env-file .env up -d
#
# Differences from docker-compose.yml (dev):
#   - image: tags instead of build: directives
#   - python -m uvicorn / python3 -m celery (binaries not on PATH in --target installs)
#   - ./app-data bind mount for /data instead of Docker volume
#   - ./postgres-data bind mount for postgres (preserves data across deploys)
#   - ./redis-data bind mount for redis (preserves data across deploys)
#   - ./alembic.ini and ./migrations bind mounts (no source code mounts)
#   - pg_isready fallback user for servers without DB_USER in .env
#   - VLLM fleet env vars passed through

name: vidistiller

services:

  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    mem_limit: 512m
    cpus: '1.0'
    container_name: tutorial_postgres
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-tutorial_db}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tutorial_network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    mem_limit: 256m
    cpus: '0.5'
    container_name: tutorial_redis
    # Keep the password out of the healthcheck command. Docker emits executed
    # healthcheck commands in events, so `redis-cli -a <password>` leaks it.
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\""]
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - ./redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tutorial_network

  api:
    image: ${VIDISTILLER_BACKEND_IMAGE_REF:?Set VIDISTILLER_BACKEND_IMAGE_REF to a signed immutable digest}
    command: ["python", "-m", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    container_name: tutorial_api
    restart: unless-stopped
    mem_limit: 2g
    cpus: '2.0'
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-20}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-40}
      DB_POOL_TIMEOUT: ${DB_POOL_TIMEOUT:-30}
      DB_POOL_RECYCLE: ${DB_POOL_RECYCLE:-3600}
      DB_POOL_PRE_PING: ${DB_POOL_PRE_PING:-true}
      DB_IDLE_IN_TX_TIMEOUT_MS: ${DB_IDLE_IN_TX_TIMEOUT_MS:-30000}
      ADMISSION_GLOBAL_ACTIVE_LIMIT: ${ADMISSION_GLOBAL_ACTIVE_LIMIT:-4}
      ADMISSION_PER_USER_ACTIVE_LIMIT: ${ADMISSION_PER_USER_ACTIVE_LIMIT:-2}
      LEASE_TTL_SECONDS: ${LEASE_TTL_SECONDS:-1200}
      LEASE_HEARTBEAT_INTERVAL_SECONDS: ${LEASE_HEARTBEAT_INTERVAL_SECONDS:-60}
      LEASE_QUARANTINE_SECONDS: ${LEASE_QUARANTINE_SECONDS:-900}
      SIDECAR_SLOTS: ${SIDECAR_SLOTS:-1}
      SLIDE_LLM_BATCH_SIZE: ${SLIDE_LLM_BATCH_SIZE:-20}
      SLIDE_LLM_BATCH_CONCURRENCY: ${SLIDE_LLM_BATCH_CONCURRENCY:-1}
      OLLAMA_URL: ${OLLAMA_URL}
      OLLAMA_MODEL: ${OLLAMA_MODEL}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-120}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      ALLOWED_LLM_HOSTS: ${ALLOWED_LLM_HOSTS:-}
      VIDISTILLER_API_KEY: ${VIDISTILLER_API_KEY:-}
      API_HOST: 0.0.0.0
      API_PORT: ${API_PORT:-8000}
      CORS_ORIGINS: ${CORS_ORIGINS:-[]}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENABLED: ${SENTRY_ENABLED:-false}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.1}
      SENTRY_ENVIRONMENT: ${ENVIRONMENT:-production}
      DATA_DIR: /data
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY}
      VLLM_PRIMARY_URL: ${VLLM_PRIMARY_URL:-}
      VLLM_SECONDARY_URL: ${VLLM_SECONDARY_URL:-}
      VLLM_VISION_URL: ${VLLM_VISION_URL:-}
      VLLM_AUXILIARY_URL: ${VLLM_AUXILIARY_URL:-}
      LLM_MODEL_PROFILES_PATH: ${LLM_MODEL_PROFILES_PATH:-}
      LLM_ALLOW_CLOUD_FALLBACK: ${LLM_ALLOW_CLOUD_FALLBACK:-false}
      SIDECAR_CONFIG_PATH: ${SIDECAR_CONFIG_PATH:-}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./app-data:/data
      - ./alembic.ini:/app/alembic.ini:ro
      - ./migrations:/app/migrations:ro
      # Operator-owned, non-secret model profiles stay outside the repository.
      - ${LLM_MODEL_PROFILES_HOST_DIR:-./config}:/etc/vidistiller:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tutorial_network

  celery_worker:
    image: ${VIDISTILLER_BACKEND_IMAGE_REF:?Set VIDISTILLER_BACKEND_IMAGE_REF to a signed immutable digest}
    command: python3 -m celery -A app.tasks worker --loglevel=${LOG_LEVEL:-info} --concurrency=${CELERY_WORKER_CONCURRENCY:-2}
    container_name: tutorial_celery_worker
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-20}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-40}
      DB_POOL_TIMEOUT: ${DB_POOL_TIMEOUT:-30}
      DB_POOL_RECYCLE: ${DB_POOL_RECYCLE:-3600}
      DB_POOL_PRE_PING: ${DB_POOL_PRE_PING:-true}
      DB_IDLE_IN_TX_TIMEOUT_MS: ${DB_IDLE_IN_TX_TIMEOUT_MS:-30000}
      CELERY_VISIBILITY_TIMEOUT: ${CELERY_VISIBILITY_TIMEOUT:-7800}
      CELERY_TASK_TIME_LIMIT: ${CELERY_TASK_TIME_LIMIT:-7200}
      CELERY_TASK_SOFT_TIME_LIMIT: ${CELERY_TASK_SOFT_TIME_LIMIT:-6600}
      OLLAMA_URL: ${OLLAMA_URL}
      OLLAMA_MODEL: ${OLLAMA_MODEL}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-120}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      ALLOWED_LLM_HOSTS: ${ALLOWED_LLM_HOSTS:-}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENABLED: ${SENTRY_ENABLED:-false}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.1}
      SENTRY_ENVIRONMENT: ${ENVIRONMENT:-production}
      DATA_DIR: /data
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY}
      VLLM_PRIMARY_URL: ${VLLM_PRIMARY_URL:-}
      VLLM_SECONDARY_URL: ${VLLM_SECONDARY_URL:-}
      VLLM_VISION_URL: ${VLLM_VISION_URL:-}
      VLLM_AUXILIARY_URL: ${VLLM_AUXILIARY_URL:-}
      LLM_MODEL_PROFILES_PATH: ${LLM_MODEL_PROFILES_PATH:-}
      LLM_ALLOW_CLOUD_FALLBACK: ${LLM_ALLOW_CLOUD_FALLBACK:-false}
      SIDECAR_CONFIG_PATH: ${SIDECAR_CONFIG_PATH:-}
      ADMISSION_GLOBAL_ACTIVE_LIMIT: ${ADMISSION_GLOBAL_ACTIVE_LIMIT:-4}
      ADMISSION_PER_USER_ACTIVE_LIMIT: ${ADMISSION_PER_USER_ACTIVE_LIMIT:-2}
      LEASE_TTL_SECONDS: ${LEASE_TTL_SECONDS:-1200}
      LEASE_HEARTBEAT_INTERVAL_SECONDS: ${LEASE_HEARTBEAT_INTERVAL_SECONDS:-60}
      LEASE_QUARANTINE_SECONDS: ${LEASE_QUARANTINE_SECONDS:-900}
      SIDECAR_SLOTS: ${SIDECAR_SLOTS:-1}
      SLIDE_LLM_BATCH_SIZE: ${SLIDE_LLM_BATCH_SIZE:-20}
      SLIDE_LLM_BATCH_CONCURRENCY: ${SLIDE_LLM_BATCH_CONCURRENCY:-1}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    mem_limit: 4g
    cpus: '2.0'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./app-data:/data
      - ./alembic.ini:/app/alembic.ini:ro
      - ./migrations:/app/migrations:ro
      - ${LLM_MODEL_PROFILES_HOST_DIR:-./config}:/etc/vidistiller:ro
    healthcheck:
      test: ["CMD-SHELL", "python3 -m celery -A app.tasks inspect ping --timeout 5 -d celery@$$HOSTNAME 2>&1 | grep -q pong || exit 1"]
      interval: 30s
      timeout: 15s
      start_period: 40s
      retries: 3
    networks:
      - tutorial_network

  web:
    image: ${VIDISTILLER_FRONTEND_IMAGE_REF:?Set VIDISTILLER_FRONTEND_IMAGE_REF to a signed immutable digest}
    container_name: tutorial_web
    restart: unless-stopped
    mem_limit: 512m
    cpus: '1.0'
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    environment:
      NODE_ENV: ${ENVIRONMENT:-production}
      NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
      BACKEND_URL: http://api:8000
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - tutorial_network

  pgadmin:
    image: dpage/pgadmin4:8.14
    restart: unless-stopped
    mem_limit: 256m
    cpus: '0.5'
    container_name: tutorial_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      PGADMIN_DISABLE_POSTFIX: "true"
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-5050}:80"
    depends_on:
      - postgres
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:80/misc/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - tutorial_network

volumes: {}

networks:
  tutorial_network:
    driver: bridge
