[project]
name = "vidistiller"
version = "1.16.1"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
]

[tool.pytest.ini_options]
markers = [
    "staging: Staging deployment integration tests (run with -m staging)",
    "perf: Performance regression checks",
]

[tool.coverage.run]
branch = true
source = ["backend/app"]

[tool.coverage.report]
fail_under = 70
