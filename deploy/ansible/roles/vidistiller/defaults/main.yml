---
vidistiller_dir: /opt/vidistiller

# Immutable image references and identity policy are operator-supplied per
# environment. The role refuses mutable tags before it pulls or starts them.
backend_image_ref: ""
frontend_image_ref: ""
cosign_certificate_identity_regexp: ""
cosign_oidc_issuer: "https://token.actions.githubusercontent.com"

# Postgres
db_name: tutorial_db
db_user: tutorial_user
db_port: 5432

# Redis
redis_port: 6379
redis_maxmemory: "512mb"
redis_maxmemory_policy: "allkeys-lru"

# App ports
api_port: 8000
frontend_port: 3000
pgadmin_port: 5050

# Ollama — direct IP routable from the prod VM (carried over from the old LXC config)
ollama_url: "http://192.0.2.10:11434"
ollama_model: "qwen3:8b"

# Celery worker resource limits
celery_mem_limit: "4g"
celery_cpu_limit: "2.0"
