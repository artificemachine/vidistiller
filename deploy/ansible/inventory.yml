# Ansible Inventory — vidistiller-host
# SSH reaches the VM via ProxyJump through proxmox-node (192.0.2.10)
all:
  hosts:
    vidistiller-host:
      ansible_host: 192.0.2.10
      ansible_user: sysadmin          # ciuser from ubuntu2404-cloud-v2 template
      ansible_become: true
      ansible_ssh_private_key_file: "{{ lookup('env', 'HOME') }}/.ssh/id_ed25519"
      ansible_ssh_common_args: '-o ProxyJump=proxmox-node'
      ansible_python_interpreter: /usr/bin/python3
