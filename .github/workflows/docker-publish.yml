name: Docker Hub Publish

# REMOVED (release-candidate rollout): the tag-triggered rebuild path no
# longer participates in release promotion. A release is promoted from the
# signed candidate digests recorded in an approved candidate-manifest.json —
# promote-release.yml retags the existing digests with
# `docker buildx imagetools create` and never rebuilds. Candidates are built
# and signed once on main by deploy.yml (tagged only sha-<full SHA>).
#
# This file is kept as a deprecation stub so stale automation pointing at it
# fails loudly in the logs instead of silently building mutable images.

on:
  workflow_dispatch:

jobs:
  removed:
    name: Tag rebuild path removed
    runs-on: ubuntu-latest
    steps:
      - name: Explain
        run: |
          echo "docker-publish.yml no longer builds or pushes images."
          echo "Main builds signed candidates (deploy.yml, tags sha-<full SHA>)."
          echo "Releases are promoted from candidate drafts via promote-release.yml"
          echo "(digest retag only, no rebuild)."
