name: Publish signed PostgreSQL restore image

on:
  workflow_dispatch:

jobs:
  mirror-and-sign:
    name: Mirror PostgreSQL and sign its digest
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Verify image namespace configuration
        env:
          IMAGE_NAMESPACE: ${{ vars.DOCKER_IMAGE_NAMESPACE }}
        run: |
          test -n "$IMAGE_NAMESPACE" || {
            echo "DOCKER_IMAGE_NAMESPACE repository variable is required" >&2
            exit 1
          }

      - name: Log in to Docker Hub
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Mirror and sign immutable PostgreSQL image
        env:
          IMAGE_NAMESPACE: ${{ vars.DOCKER_IMAGE_NAMESPACE }}
        run: |
          source='postgres@sha256:3d0f7584ed7d04e27fa050d6683a74746608faf21f202be78460d679cc56461f'
          target="${{ vars.DOCKER_IMAGE_NAMESPACE }}/vidistiller-postgres:15-alpine"
          docker pull "$source"
          docker tag "$source" "$target"
          docker push "$target"
          digest="$(docker buildx imagetools inspect "$target" --format '{{.Manifest.Digest}}')"
          case "$digest" in
            sha256:*) ;;
            *) echo "Unable to resolve immutable mirror digest" >&2; exit 1 ;;
          esac
          cosign sign --yes "${target}@${digest}"
          cosign verify --certificate-identity-regexp \
            "^https://github.com/${{ github.repository }}/.github/workflows/publish-postgres-mirror\\.yml@.*$" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${target}@${digest}" >/dev/null
          echo "POSTGRES_RESTORE_IMAGE=${target}@${digest}" >> "$GITHUB_STEP_SUMMARY"
