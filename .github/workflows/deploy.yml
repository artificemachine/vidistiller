name: Deploy

on:
  push:
    branches: [main, staging]
  workflow_dispatch:
    inputs:
      run_migrations:
        description: 'Run alembic migrations after deploy'
        required: false
        default: 'true'
        type: choice
        options: ['true', 'false']

jobs:
  # ── 1. Backend tests (cloud runner) ────────────────────────────────────────
  test-backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r backend/requirements.txt pytest

      - name: Download NLTK data
        run: python -c "import nltk; nltk.download('punkt_tab', quiet=True)"

      - name: Run tests
        run: PYTHONPATH=backend pytest tests/ -q

  # ── 2. Frontend tests (cloud runner) ───────────────────────────────────────
  test-frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Run tests
        run: cd frontend && npm test -- --run

  # ── 3. Security gate (cloud runner) ────────────────────────────────────────
  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install ShipGuard
        run: pip install shipguard

      - name: Run SAST scan
        run: |
          # ShipGuard exits non-zero on any finding. Capture that status so the
          # severity-aware Python gate can distinguish findings from scan errors.
          # --exclude-rules PY-007: shipguard 0.5.2 (PyPI's public latest)
          # misfires PY-007 on the plain-prose module docstring at
          # scripts/release_candidate.py:2, flagging it as an f-string SQL
          # injection — it is not an f-string and contains no SQL. See
          # security.yml for the full writeup; keep both in sync.
          set +e
          shipguard scan . --exclude-rules PY-007 --format json > shipguard.json
          export SHIPGUARD_EXIT=$?
          set -e
          python3 - << 'EOF'
          import json, os, sys
          data = json.load(open("shipguard.json"))
          findings = data.get("findings", [])
          scan_exit = int(os.environ["SHIPGUARD_EXIT"])
          if scan_exit and not findings:
              print(f"ShipGuard failed with exit {scan_exit} and no findings payload")
              sys.exit(scan_exit)
          blockers = [f for f in findings if f.get("severity") in ("critical", "high")]
          if blockers:
              for b in blockers:
                  print(f"BLOCKER: [{b['severity'].upper()}] {b['rule_id']} — {b['file']}:{b.get('line', '?')}: {b['message']}")
              sys.exit(1)
          print(f"Security gate passed. {len(findings)} findings, 0 blockers.")
          EOF

  # ── 4. Candidate build & signing (cloud runner) ────────────────────────────
  #
  # A main build is a CANDIDATE, not a release. Images are tagged only as
  # sha-<full SHA>; both digests are cosign-signed and cosign-attested, and
  # one candidate-manifest.json binds the two digests plus the compose,
  # alembic and migrations identity to the exact same commit (verified by
  # scripts/release_candidate.py). The manifest, SHA256SUMS, SBOMs and the
  # provenance reference are uploaded as assets to a GitHub DRAFT release
  # named candidate-<full SHA> with target_commitish set to that SHA — the
  # durable candidate store. Promotion is a separate, human-approved step
  # (promote-release.yml) that consumes only the draft's numeric release ID
  # and never rebuilds. Candidate drafts are retained for at least 30 days;
  # nothing in the release tooling deletes them before their promotion
  # decision.
  build-candidate:
    name: Build & sign release candidate
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend, security]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write   # create the candidate draft release
      id-token: write   # keyless cosign sign/attest
    concurrency:
      group: build-candidate
      cancel-in-progress: false
    outputs:
      candidate_release_id: ${{ steps.candidate.outputs.candidate_release_id }}
      commit_sha: ${{ steps.identity.outputs.commit_sha }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Verify image namespace configuration
        env:
          IMAGE_NAMESPACE: ${{ vars.DOCKER_IMAGE_NAMESPACE }}
        run: |
          test -n "$IMAGE_NAMESPACE" || {
            echo "DOCKER_IMAGE_NAMESPACE repository variable is required" >&2
            exit 1
          }

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Record candidate identity
        id: identity
        run: |
          if ! echo "${GITHUB_SHA}" | grep -qE '^[0-9a-f]{40}$'; then
            echo "::error::GITHUB_SHA (${GITHUB_SHA}) is not a full 40-character commit SHA" >&2
            exit 1
          fi
          echo "commit_sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      # Candidates are tagged ONLY as sha-<full SHA> — no latest/main drift.
      # The promotion path consumes the digest, never the tag.
      - name: Build and push backend candidate
        id: build-backend
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ vars.DOCKER_IMAGE_NAMESPACE }}/vidistiller-backend:sha-${{ steps.identity.outputs.commit_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend candidate
        id: build-frontend
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./frontend
          file: frontend/Dockerfile
          push: true
          tags: ${{ vars.DOCKER_IMAGE_NAMESPACE }}/vidistiller-frontend:sha-${{ steps.identity.outputs.commit_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sign candidate digests
        env:
          NAMESPACE: ${{ vars.DOCKER_IMAGE_NAMESPACE }}
          BACKEND_DIGEST: ${{ steps.build-backend.outputs.digest }}
          FRONTEND_DIGEST: ${{ steps.build-frontend.outputs.digest }}
        run: |
          cosign sign --yes "${NAMESPACE}/vidistiller-backend@${BACKEND_DIGEST}"
          cosign sign --yes "${NAMESPACE}/vidistiller-frontend@${FRONTEND_DIGEST}"

      - name: Write provenance predicate
        env:
          COMMIT_SHA: ${{ steps.identity.outputs.commit_sha }}
        run: |
          jq -n \
            --arg commit "${COMMIT_SHA}" \
            --arg run_id "${{ github.run_id }}" \
            --arg repo "${{ github.repository }}" \
            '{
              builder: {id: ("https://github.com/" + $repo + "/actions/runs/" + $run_id)},
              buildType: ("https://github.com/" + $repo + "/.github/workflows/deploy.yml@refs/heads/main"),
              invocation: {
                configSource: {
                  uri: ("git+https://github.com/" + $repo),
                  digest: {sha1: $commit},
                  entryPoint: "deploy.yml"
                }
              },
              metadata: {
                buildInvocationId: ("https://github.com/" + $repo + "/actions/runs/" + $run_id),
                completeness: {parameters: true, environment: false, materials: true},
                reproducible: false
              }
            }' > provenance.json

      - name: Attest candidate digests
        env:
          NAMESPACE: ${{ vars.DOCKER_IMAGE_NAMESPACE }}
          BACKEND_DIGEST: ${{ steps.build-backend.outputs.digest }}
          FRONTEND_DIGEST: ${{ steps.build-frontend.outputs.digest }}
        run: |
          cosign attest --yes --type slsaprovenance \
            --predicate provenance.json \
            "${NAMESPACE}/vidistiller-backend@${BACKEND_DIGEST}"
          cosign attest --yes --type slsaprovenance \
            --predicate provenance.json \
            "${NAMESPACE}/vidistiller-frontend@${FRONTEND_DIGEST}"

      - name: Generate SBOMs
        env:
          NAMESPACE: ${{ vars.DOCKER_IMAGE_NAMESPACE }}
          BACKEND_DIGEST: ${{ steps.build-backend.outputs.digest }}
          FRONTEND_DIGEST: ${{ steps.build-frontend.outputs.digest }}
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin v1.51.1
          syft "${NAMESPACE}/vidistiller-backend@${BACKEND_DIGEST}" -o spdx-json > sbom-backend.json
          syft "${NAMESPACE}/vidistiller-frontend@${FRONTEND_DIGEST}" -o spdx-json > sbom-frontend.json

      - name: Create candidate manifest
        env:
          COMMIT_SHA: ${{ steps.identity.outputs.commit_sha }}
          NAMESPACE: ${{ vars.DOCKER_IMAGE_NAMESPACE }}
          BACKEND_DIGEST: ${{ steps.build-backend.outputs.digest }}
          FRONTEND_DIGEST: ${{ steps.build-frontend.outputs.digest }}
        run: |
          python3 scripts/release_candidate.py create \
            --commit "${COMMIT_SHA}" \
            --backend-ref "${NAMESPACE}/vidistiller-backend@${BACKEND_DIGEST}" \
            --frontend-ref "${NAMESPACE}/vidistiller-frontend@${FRONTEND_DIGEST}" \
            --run-id "${{ github.run_id }}" \
            --attestation-uri "${NAMESPACE}/vidistiller-backend@${BACKEND_DIGEST}" \
            --output candidate-manifest.json
          cat candidate-manifest.json

      - name: Sum candidate assets
        run: |
          sha256sum candidate-manifest.json provenance.json sbom-backend.json sbom-frontend.json > SHA256SUMS

      - name: Create candidate draft release
        id: candidate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_SHA: ${{ steps.identity.outputs.commit_sha }}
        run: |
          tag="candidate-${COMMIT_SHA}"
          existing="$(gh api "repos/${GITHUB_REPOSITORY}/releases" --jq \
            ".[] | select(.tag_name == \"${tag}\") | .id" | head -n1)"
          if [ -n "${existing}" ]; then
            echo "::error::candidate release ${tag} already exists (id ${existing}); refusing to overwrite" >&2
            exit 1
          fi
          # --draft keeps the tag unpublished until promotion; --target sets
          # target_commitish to the exact commit the manifest binds.
          gh release create "${tag}" --draft --target "${COMMIT_SHA}" \
            --title "${tag}" \
            --notes "Signed release candidate for ${COMMIT_SHA}. Promote via promote-release.yml using this draft's numeric release ID."
          # The releases-list endpoint can lag a freshly created release by a
          # second or two (read-after-write is not guaranteed here), so an
          # immediate single lookup can spuriously fail even though the
          # release exists — retry briefly before giving up.
          release_id=""
          for attempt in 1 2 3 4 5; do
            release_id="$(gh api "repos/${GITHUB_REPOSITORY}/releases" --jq \
              ".[] | select(.tag_name == \"${tag}\") | .id" | head -n1)"
            [ -n "${release_id}" ] && break
            sleep 2
          done
          test -n "${release_id}" || {
            echo "::error::could not resolve candidate release id for ${tag}" >&2
            exit 1
          }
          gh release upload "${tag}" \
            candidate-manifest.json SHA256SUMS provenance.json sbom-backend.json sbom-frontend.json
          echo "candidate_release_id=${release_id}" >> "$GITHUB_OUTPUT"

  # ── 5. Deploy to staging (self-hosted runner on staging LXC) ───────────────
  #
  # Production is NOT deployed from this workflow: releases are promoted from
  # the approved candidate draft by promote-release.yml, which passes the
  # manifest's commit SHA to the production deployment. To pin staging to the
  # same signed digests, stack docker-compose.staging-images.yml (see its
  # header) — the base compose still builds from source without it.
  deploy-staging:
    name: Deploy → staging
    runs-on: [self-hosted, linux, vidistiller-staging]
    needs: [test-backend, test-frontend]
    if: github.ref == 'refs/heads/staging'
    environment: staging
    concurrency:
      group: deploy-staging
      cancel-in-progress: false

    steps:
      - name: Pull latest images
        run: |
          cd "${VIDISTILLER_DIR:-/opt/vidistiller}"
          docker compose -f docker-compose.yml -f docker-compose.staging.yml pull

      - name: Deploy staging
        run: |
          cd "${VIDISTILLER_DIR:-/opt/vidistiller}"
          docker compose -f docker-compose.yml -f docker-compose.staging.yml down --remove-orphans
          docker compose -f docker-compose.yml -f docker-compose.staging.yml up -d --remove-orphans

      - name: Run migrations
        if: ${{ github.event.inputs.run_migrations != 'false' }}
        run: |
          cd "${VIDISTILLER_DIR:-/opt/vidistiller}"
          sleep 8
          echo "Running alembic upgrade head..."
          docker compose -f docker-compose.yml -f docker-compose.staging.yml exec -T api alembic upgrade head
          echo "Migrations complete."

      - name: Health check
        run: |
          sleep 12
          curl -sf http://localhost:8001/health || { echo "Staging health check failed"; exit 1; }
          echo "Staging deploy successful."
