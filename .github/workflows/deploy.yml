name: Deploy

on:
  push:
    branches: [main, staging]
  workflow_dispatch:
    inputs:
      run_migrations:
        description: 'Run alembic migrations after deploy'
        required: false
        default: 'true'
        type: choice
        options: ['true', 'false']

jobs:
  # ── 1. Backend tests (cloud runner) ────────────────────────────────────────
  test-backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r backend/requirements.txt pytest

      - name: Download NLTK data
        run: python -c "import nltk; nltk.download('punkt_tab', quiet=True)"

      - name: Run tests
        run: PYTHONPATH=backend pytest tests/ -q

  # ── 2. Frontend tests (cloud runner) ───────────────────────────────────────
  test-frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'

      - name: Install dependencies
        run: cd frontend && npm install

      - name: Run tests
        run: cd frontend && npm test -- --run

  # ── 3. Security gate (cloud runner) ────────────────────────────────────────
  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install ShipGuard
        run: pip install shipguard

      - name: Run SAST scan
        run: |
          # shipguard exits non-zero on ANY finding; the python block below is
          # the real gate (fails only on critical/high). Without `|| true` the
          # default `bash -eo pipefail` aborts here before the gate can run.
          shipguard scan . --format json > shipguard.json || true
          python3 - << 'EOF'
          import json, sys
          data = json.load(open("shipguard.json"))
          findings = data.get("findings", [])
          blockers = [f for f in findings if f.get("severity") in ("critical", "high")]
          if blockers:
              for b in blockers:
                  print(f"BLOCKER: [{b['severity'].upper()}] {b['rule_id']} — {b['file']}:{b.get('line', '?')}: {b['message']}")
              sys.exit(1)
          print(f"Security gate passed. {len(findings)} findings, 0 blockers.")
          EOF

  # ── 4. Docker Hub publish (cloud runner) ───────────────────────────────────
  #
  # Runs before deploy-production so the server always pulls the fresh image.
  # docker-publish.yml handles tag-based publishes; this job owns main-branch.
  publish:
    name: Publish images
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend, security]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to Docker Hub
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build and push backend
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: newblacc/vidistiller-backend:latest,newblacc/vidistiller-backend:main
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./frontend
          file: frontend/Dockerfile
          push: true
          tags: newblacc/vidistiller-frontend:latest,newblacc/vidistiller-frontend:main
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 5. Deploy to production (self-hosted runner on the prod VM) ───────────
  #
  # Runs directly on the prod VM — no SSH tunnel needed. The runner has direct
  # access to Docker and the project directory.
  deploy-production:
    name: Deploy → production
    runs-on: [self-hosted, linux, vidistiller-prod]
    needs: [test-backend, test-frontend, security, publish]
    if: github.ref == 'refs/heads/main'
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    steps:
      - name: Sync compose and config files
        run: |
          cd "${VIDISTILLER_DIR:-/opt/vidistiller}"
          curl -fsSL \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.raw" \
            "https://api.github.com/repos/${{ github.repository }}/contents/docker-compose.prod.yml?ref=${{ github.sha }}" \
            -o docker-compose.prod.yml

      # This job restarts containers on whatever VIDISTILLER_IMAGE_TAG is
      # already pinned in the VM's .env — it does NOT roll out new code by
      # itself. The real release flow is: merge -> tag vX.Y.Z -> docker-publish
      # builds the versioned image -> a human bumps VIDISTILLER_IMAGE_TAG on
      # the VM -> pull/up. Without this check, a merge to main runs this job,
      # it reports "success", and that reads as "the new code is live" when
      # it usually just restarted the same old image on a stale pin (see
      # incident_log.md 2026-08-10, caught during PR #196 deploy). Fail loud
      # here instead of silently no-op-ing.
      - name: Verify pinned image tag matches this commit's version
        run: |
          cd "${VIDISTILLER_DIR:-/opt/vidistiller}"
          EXPECTED_VERSION=$(curl -fsSL \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.raw" \
            "https://api.github.com/repos/${{ github.repository }}/contents/pyproject.toml?ref=${{ github.sha }}" \
            | grep -m1 '^version = ' | sed -E 's/version = "(.*)"/\1/')
          CURRENT_TAG=$(grep '^VIDISTILLER_IMAGE_TAG=' .env | cut -d= -f2)

          if [ -z "$EXPECTED_VERSION" ]; then
            echo "::error::Could not read version from pyproject.toml at ${{ github.sha }} (API call failed or field missing) — cannot verify the deploy, failing closed."
            exit 1
          fi

          echo "Commit's pyproject.toml version: $EXPECTED_VERSION"
          echo "VM's pinned VIDISTILLER_IMAGE_TAG: $CURRENT_TAG"

          if [ "$EXPECTED_VERSION" != "$CURRENT_TAG" ]; then
            echo "::error::VIDISTILLER_IMAGE_TAG ($CURRENT_TAG) does not match this commit's version ($EXPECTED_VERSION). This job only restarts containers on the currently pinned image — it will NOT roll out $EXPECTED_VERSION by itself. Tag v$EXPECTED_VERSION, wait for docker-publish.yml to build newblacc/vidistiller-{backend,frontend}:$EXPECTED_VERSION, then bump VIDISTILLER_IMAGE_TAG=$EXPECTED_VERSION in the VM's .env before re-running this job."
            exit 1
          fi

          echo "Pinned tag matches this commit's version — proceeding with restart."

      - name: Enable Sentry if DSN is configured
        if: env.SENTRY_DSN != ''
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          cd "${VIDISTILLER_DIR:-/opt/vidistiller}"
          sed -i "s|^SENTRY_DSN=.*|SENTRY_DSN=${SENTRY_DSN}|" .env
          sed -i "s|^SENTRY_ENABLED=.*|SENTRY_ENABLED=true|" .env
          grep -q "^NEXT_PUBLIC_SENTRY_DSN=" .env \
            && sed -i "s|^NEXT_PUBLIC_SENTRY_DSN=.*|NEXT_PUBLIC_SENTRY_DSN=${SENTRY_DSN}|" .env \
            || echo "NEXT_PUBLIC_SENTRY_DSN=${SENTRY_DSN}" >> .env

      - name: Pull latest images
        run: |
          cd "${VIDISTILLER_DIR:-/opt/vidistiller}"
          docker compose -f docker-compose.prod.yml pull

      - name: Ensure app-data ownership matches container uid
        run: |
          cd "${VIDISTILLER_DIR:-/opt/vidistiller}"
          sudo mkdir -p app-data/videos app-data/snapshots app-data/slides
          sudo chown -R 1001:1001 app-data

      - name: Deploy
        run: |
          cd "${VIDISTILLER_DIR:-/opt/vidistiller}"
          docker compose -f docker-compose.prod.yml down --remove-orphans
          docker compose -f docker-compose.prod.yml up -d --remove-orphans

      - name: Run migrations
        if: ${{ github.event.inputs.run_migrations != 'false' }}
        run: |
          cd "${VIDISTILLER_DIR:-/opt/vidistiller}"
          sleep 8
          echo "Running alembic upgrade head..."
          docker compose -f docker-compose.prod.yml exec -T api sh -c 'cd /app && python -m alembic upgrade head'
          echo "Migrations complete."

      - name: Health check
        run: |
          sleep 12
          curl -sf "${{ vars.PROD_API_BASE_URL }}/health" || { echo "API health check failed"; exit 1; }
          echo "Deploy successful"

  # ── 6. Deploy to staging (self-hosted runner on staging LXC) ───────────────
  deploy-staging:
    name: Deploy → staging
    runs-on: [self-hosted, linux, vidistiller-staging]
    needs: [test-backend, test-frontend]
    if: github.ref == 'refs/heads/staging'
    environment: staging
    concurrency:
      group: deploy-staging
      cancel-in-progress: false

    steps:
      - name: Pull latest images
        run: |
          cd "${VIDISTILLER_DIR:-/opt/vidistiller}"
          docker compose -f docker-compose.yml -f docker-compose.staging.yml pull

      - name: Deploy staging
        run: |
          cd "${VIDISTILLER_DIR:-/opt/vidistiller}"
          docker compose -f docker-compose.yml -f docker-compose.staging.yml down --remove-orphans
          docker compose -f docker-compose.yml -f docker-compose.staging.yml up -d --remove-orphans

      - name: Run migrations
        if: ${{ github.event.inputs.run_migrations != 'false' }}
        run: |
          cd "${VIDISTILLER_DIR:-/opt/vidistiller}"
          sleep 8
          echo "Running alembic upgrade head..."
          docker compose -f docker-compose.yml -f docker-compose.staging.yml exec -T api alembic upgrade head
          echo "Migrations complete."

      - name: Health check
        run: |
          sleep 12
          curl -sf http://localhost:8001/health || { echo "Staging health check failed"; exit 1; }
          echo "Staging deploy successful."
