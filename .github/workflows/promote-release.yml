name: Promote release

# Human-approved promotion of a signed release candidate.
#
# Consumes ONLY the numeric ID of the candidate draft release created by
# deploy.yml on main. The draft (tag candidate-<full SHA>, target_commitish
# set to the same SHA) is the durable candidate store: its manifest and
# assets are fetched BY ASSET ID, every checksum is recomputed, and the
# recorded OCI digests are reused as-is. This workflow NEVER rebuilds
# images — "retagging" is `docker buildx imagetools create` from the
# existing digest. The manifest's commit SHA is the only identity passed
# to the production deployment, which re-verifies it before fetching any
# configuration or restarting containers.
#
# The candidate draft is intentionally NOT deleted on promotion: candidate
# drafts are retained for at least 30 days and are never removed before
# their promotion decision.

on:
  workflow_dispatch:
    inputs:
      candidate_release_id:
        description: 'Numeric ID of the candidate draft release (build-candidate output)'
        required: true
        type: string
      version:
        description: 'Version tag to publish (e.g. v1.17.0)'
        required: true
        type: string

permissions:
  # contents: write (not read) — GitHub's REST API returns 403 "Resource not
  # accessible by integration" fetching a DRAFT release with only
  # contents: read; a draft is treated like any other unpublished/private
  # object and needs push-level repo access to view, even though this job
  # never writes anything itself. Confirmed empirically 2026-09-03: the
  # first-ever run of this workflow failed at "Fetch candidate draft release
  # by ID" with contents: read.
  contents: write
  id-token: write

env:
  CANDIDATE_ASSETS: "candidate-manifest.json SHA256SUMS provenance.json sbom-backend.json sbom-frontend.json"

jobs:
  # ── 1. Verify the candidate draft, manifest and repository identity ───────
  verify-candidate:
    name: Verify candidate draft, manifest & repo identity
    runs-on: ubuntu-latest
    outputs:
      commit_sha: ${{ steps.manifest.outputs.commit_sha }}
      backend_ref: ${{ steps.manifest.outputs.backend_ref }}
      frontend_ref: ${{ steps.manifest.outputs.frontend_ref }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # full history: the candidate commit must resolve here

      - name: Validate promotion inputs
        run: |
          echo "${{ inputs.candidate_release_id }}" | grep -qE '^[0-9]+$' || {
            echo "::error::candidate_release_id must be the numeric release ID" >&2
            exit 1
          }
          echo "${{ inputs.version }}" | grep -qE '^[A-Za-z0-9][A-Za-z0-9._-]*$' || {
            echo "::error::version must be a plain tag value" >&2
            exit 1
          }

      - name: Fetch candidate draft release by ID
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/releases/${{ inputs.candidate_release_id }}" > release.json
          jq -e '.draft == true' release.json >/dev/null || {
            echo "::error::release ${{ inputs.candidate_release_id }} is not a draft — refusing to promote" >&2
            exit 1
          }
          target="$(jq -r '.target_commitish' release.json)"
          echo "${target}" | grep -qE '^[0-9a-f]{40}$' || {
            echo "::error::draft target_commitish (${target}) is not a full 40-character SHA" >&2
            exit 1
          }
          echo "target_commitish=${target}" >> "$GITHUB_OUTPUT"

      - name: Download candidate assets by asset ID
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p candidate
          for name in ${CANDIDATE_ASSETS}; do
            asset_id="$(jq -r --arg name "${name}" \
              '.assets[] | select(.name == $name) | .id' release.json)"
            test -n "${asset_id}" || {
              echo "::error::candidate draft is missing asset ${name}" >&2
              exit 1
            }
            gh api "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}" \
              -H "Accept: application/octet-stream" > "candidate/${name}"
          done

      - name: Recompute checksums
        run: cd candidate && sha256sum -c SHA256SUMS

      - name: Verify manifest identity
        id: manifest
        env:
          TARGET: ${{ steps.release.outputs.target_commitish }}
        run: |
          python3 scripts/release_candidate.py verify \
            candidate/candidate-manifest.json --expect-commit "${TARGET}"
          backend_ref="$(jq -r '.images.backend' candidate/candidate-manifest.json)"
          frontend_ref="$(jq -r '.images.frontend' candidate/candidate-manifest.json)"
          {
            echo "commit_sha=${TARGET}"
            echo "backend_ref=${backend_ref}"
            echo "frontend_ref=${frontend_ref}"
          } >> "$GITHUB_OUTPUT"

      # Acceptance: promotion fails BEFORE any retag when any manifest
      # identity differs from its current repository object. Git objects are
      # content-addressed, so a commit that resolves in THIS repository
      # guarantees the compose/alembic/migrations content recorded at build
      # time is exactly what gets fetched at that ref later.
      - name: Verify candidate commit against current repository objects
        env:
          TARGET: ${{ steps.release.outputs.target_commitish }}
        run: |
          git cat-file -e "${TARGET}^{commit}" || {
            echo "::error::candidate commit ${TARGET} is not an object in this repository" >&2
            exit 1
          }
          git fetch origin main
          git merge-base --is-ancestor "${TARGET}" origin/main || {
            echo "::error::candidate commit ${TARGET} is not reachable from origin/main" >&2
            exit 1
          }
          echo "Config identity at the candidate commit:"
          echo "  docker-compose.prod.yml blob: $(git rev-parse "${TARGET}:docker-compose.prod.yml")"
          echo "  alembic.ini blob:             $(git rev-parse "${TARGET}:alembic.ini")"
          echo "  migrations tree:              $(git rev-parse "${TARGET}:migrations")"

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Verify candidate signatures and attestations
        env:
          BACKEND_REF: ${{ steps.manifest.outputs.backend_ref }}
          FRONTEND_REF: ${{ steps.manifest.outputs.frontend_ref }}
        run: |
          for image in "${BACKEND_REF}" "${FRONTEND_REF}"; do
            cosign verify \
              --certificate-identity-regexp \
                "^https://github.com/${{ github.repository }}/.github/workflows/deploy\\.yml@.*$" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              "${image}" > /dev/null
            # --type slsaprovenance: deploy.yml's "Attest candidate digests"
            # step signs with `cosign attest --type slsaprovenance`. Without
            # a matching --type here, cosign defaults to "custom" and fails
            # with "none of the attestations matched the predicate type:
            # custom, found: ...slsa.dev/provenance/v0.2" even though the
            # attestation is valid. Confirmed empirically 2026-09-03.
            cosign verify-attestation \
              --type slsaprovenance \
              --certificate-identity-regexp \
                "^https://github.com/${{ github.repository }}/.github/workflows/deploy\\.yml@.*$" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              "${image}" > /dev/null
          done

  # ── 2. Retag the approved digests to the requested version (NO rebuild) ───
  promote:
    name: Retag approved digests to version
    runs-on: ubuntu-latest
    needs: [verify-candidate]

    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # Deliberately no Docker build step anywhere in this workflow:
      # imagetools create adds a tag pointing at the already-signed digest.
      - name: Retag backend digest
        env:
          NAMESPACE: ${{ vars.DOCKER_IMAGE_NAMESPACE }}
          BACKEND_REF: ${{ needs.verify-candidate.outputs.backend_ref }}
        run: |
          docker buildx imagetools create \
            -t "${NAMESPACE}/vidistiller-backend:${{ inputs.version }}" \
            "${BACKEND_REF}"

      - name: Retag frontend digest
        env:
          NAMESPACE: ${{ vars.DOCKER_IMAGE_NAMESPACE }}
          FRONTEND_REF: ${{ needs.verify-candidate.outputs.frontend_ref }}
        run: |
          docker buildx imagetools create \
            -t "${NAMESPACE}/vidistiller-frontend:${{ inputs.version }}" \
            "${FRONTEND_REF}"

  # ── 3. Deploy to production from the single approved manifest ─────────────
  deploy-production:
    name: Deploy → production (approved manifest)
    runs-on: [self-hosted, linux, vidistiller-host]
    needs: [verify-candidate, promote]
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    steps:
      # Gate: re-verify the draft release, its checksums and the recorded
      # digests BEFORE any configuration is fetched or a container restarts.
      - name: Re-verify approved manifest before touching anything
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_SHA: ${{ needs.verify-candidate.outputs.commit_sha }}
          BACKEND_REF: ${{ needs.verify-candidate.outputs.backend_ref }}
          FRONTEND_REF: ${{ needs.verify-candidate.outputs.frontend_ref }}
        run: |
          cd "${VIDISTILLER_DIR:-/opt/vidistiller}"
          command -v gh >/dev/null 2>&1 || {
            echo "::error::gh CLI not found on production host — required to re-verify the candidate draft" >&2
            exit 1
          }
          gh api "repos/${GITHUB_REPOSITORY}/releases/${{ inputs.candidate_release_id }}" > candidate-release.json
          jq -e '.draft == true' candidate-release.json >/dev/null || {
            echo "::error::candidate release is no longer a draft — refusing to deploy" >&2
            exit 1
          }
          test "$(jq -r '.target_commitish' candidate-release.json)" = "${COMMIT_SHA}" || {
            echo "::error::draft target_commitish does not match the verified candidate commit" >&2
            exit 1
          }
          mkdir -p candidate
          for name in ${CANDIDATE_ASSETS}; do
            asset_id="$(jq -r --arg name "${name}" \
              '.assets[] | select(.name == $name) | .id' candidate-release.json)"
            test -n "${asset_id}" || {
              echo "::error::candidate draft is missing asset ${name}" >&2
              exit 1
            }
            gh api "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}" \
              -H "Accept: application/octet-stream" > "candidate/${name}"
          done
          (cd candidate && sha256sum -c SHA256SUMS)
          test "$(jq -r '.images.backend' candidate/candidate-manifest.json)" = "${BACKEND_REF}" || {
            echo "::error::backend digest in manifest differs from the verified candidate" >&2
            exit 1
          }
          test "$(jq -r '.images.frontend' candidate/candidate-manifest.json)" = "${FRONTEND_REF}" || {
            echo "::error::frontend digest in manifest differs from the verified candidate" >&2
            exit 1
          }
          echo "Approved manifest verified for commit ${COMMIT_SHA}"

      # Everything below is fetched at the MANIFEST commit — never the
      # workflow SHA — so config and migrations come from the same commit
      # the images were built and signed from.
      - name: Sync compose and config files at the manifest commit
        env:
          COMMIT_SHA: ${{ needs.verify-candidate.outputs.commit_sha }}
        run: |
          cd "${VIDISTILLER_DIR:-/opt/vidistiller}"
          curl -fsSL \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.raw" \
            "https://api.github.com/repos/${{ github.repository }}/contents/docker-compose.prod.yml?ref=${COMMIT_SHA}" \
            -o docker-compose.prod.yml
          grep -q "VIDISTILLER_BACKEND_IMAGE_REF" docker-compose.prod.yml || {
            echo "::error::fetched docker-compose.prod.yml does not pin image refs" >&2
            exit 1
          }

      # docker-compose.prod.yml bind-mounts ./alembic.ini and ./migrations
      # from this directory, so they must be synced in lockstep with the
      # deployed image — see incident_log.md 2026-08-10 (PR #198).
      - name: Sync alembic config and migrations at the manifest commit
        env:
          COMMIT_SHA: ${{ needs.verify-candidate.outputs.commit_sha }}
        run: |
          cd "${VIDISTILLER_DIR:-/opt/vidistiller}"
          curl -fsSL \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.raw" \
            "https://api.github.com/repos/${{ github.repository }}/contents/alembic.ini?ref=${COMMIT_SHA}" \
            -o alembic.ini

          mkdir -p migrations/versions
          for f in migrations/env.py migrations/script.py.mako; do
            curl -fsSL \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github.raw" \
              "https://api.github.com/repos/${{ github.repository }}/contents/${f}?ref=${COMMIT_SHA}" \
              -o "$f"
          done

          curl -fsSL \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/contents/migrations/versions?ref=${COMMIT_SHA}" \
            | jq -r '.[] | select(.type=="file") | .name' \
            | while read -r fname; do
                curl -fsSL \
                  -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
                  -H "Accept: application/vnd.github.raw" \
                  "https://api.github.com/repos/${{ github.repository }}/contents/migrations/versions/${fname}?ref=${COMMIT_SHA}" \
                  -o "migrations/versions/${fname}"
              done

          echo "Synced migrations/versions/ at commit ${COMMIT_SHA}:"
          ls -la migrations/versions/

      - name: Pin image refs to the approved manifest
        env:
          BACKEND_REF: ${{ needs.verify-candidate.outputs.backend_ref }}
          FRONTEND_REF: ${{ needs.verify-candidate.outputs.frontend_ref }}
        run: |
          cd "${VIDISTILLER_DIR:-/opt/vidistiller}"
          for image in "${BACKEND_REF}" "${FRONTEND_REF}"; do
            case "${image}" in
              *@sha256:*) ;;
              *)
                echo "::error::approved ref ${image} is not an immutable digest reference" >&2
                exit 1
                ;;
            esac
          done
          set_key() {
            key="$1"; value="$2"
            if grep -q "^${key}=" .env; then
              sed -i "s|^${key}=.*|${key}=${value}|" .env
            else
              echo "${key}=${value}" >> .env
            fi
            pinned="$(sed -n "s/^${key}=//p" .env | tail -1)"
            test "${pinned}" = "${value}" || {
              echo "::error::${key} in .env does not match the approved manifest" >&2
              exit 1
            }
          }
          set_key VIDISTILLER_BACKEND_IMAGE_REF "${BACKEND_REF}"
          set_key VIDISTILLER_FRONTEND_IMAGE_REF "${FRONTEND_REF}"
          echo "Image refs pinned to the approved manifest."

      - name: Verify signed immutable image references
        env:
          BACKEND_REF: ${{ needs.verify-candidate.outputs.backend_ref }}
          FRONTEND_REF: ${{ needs.verify-candidate.outputs.frontend_ref }}
        run: |
          cd "${VIDISTILLER_DIR:-/opt/vidistiller}"
          command -v cosign >/dev/null || {
            echo "::error::cosign must be installed on the deployment runner" >&2
            exit 1
          }
          backend_ref="$(sed -n 's/^VIDISTILLER_BACKEND_IMAGE_REF=//p' .env | tail -1)"
          frontend_ref="$(sed -n 's/^VIDISTILLER_FRONTEND_IMAGE_REF=//p' .env | tail -1)"
          test "${backend_ref}" = "${BACKEND_REF}" || {
            echo "::error::backend ref in .env does not match the approved manifest" >&2
            exit 1
          }
          test "${frontend_ref}" = "${FRONTEND_REF}" || {
            echo "::error::frontend ref in .env does not match the approved manifest" >&2
            exit 1
          }
          for image in "${backend_ref}" "${frontend_ref}"; do
            case "${image}" in
              *@sha256:*) ;;
              *)
                echo "::error::Deployment requires signed immutable image digests" >&2
                exit 1
                ;;
            esac
            cosign verify --certificate-identity-regexp \
              "^https://github.com/${{ github.repository }}/.github/workflows/deploy\\.yml@.*$" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              "${image}" >/dev/null
          done

      - name: Enable Sentry if DSN is configured
        if: env.SENTRY_DSN != ''
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          cd "${VIDISTILLER_DIR:-/opt/vidistiller}"
          sed -i "s|^SENTRY_DSN=.*|SENTRY_DSN=${SENTRY_DSN}|" .env
          sed -i "s|^SENTRY_ENABLED=.*|SENTRY_ENABLED=true|" .env
          grep -q "^NEXT_PUBLIC_SENTRY_DSN=" .env \
            && sed -i "s|^NEXT_PUBLIC_SENTRY_DSN=.*|NEXT_PUBLIC_SENTRY_DSN=${SENTRY_DSN}|" .env \
            || echo "NEXT_PUBLIC_SENTRY_DSN=${SENTRY_DSN}" >> .env

      - name: Pull latest images
        run: |
          cd "${VIDISTILLER_DIR:-/opt/vidistiller}"
          docker compose -f docker-compose.prod.yml pull

      - name: Ensure app-data ownership matches container uid
        run: |
          cd "${VIDISTILLER_DIR:-/opt/vidistiller}"
          sudo mkdir -p app-data/videos app-data/snapshots app-data/slides
          sudo chown -R 1001:1001 app-data

      - name: Deploy
        run: |
          cd "${VIDISTILLER_DIR:-/opt/vidistiller}"
          docker compose -f docker-compose.prod.yml down --remove-orphans
          docker compose -f docker-compose.prod.yml up -d --remove-orphans

      - name: Run migrations
        run: |
          cd "${VIDISTILLER_DIR:-/opt/vidistiller}"
          sleep 8
          echo "Running alembic upgrade head..."
          docker compose -f docker-compose.prod.yml exec -T api sh -c 'cd /app && python -m alembic upgrade head'
          echo "Migrations complete."

      - name: Health check
        run: |
          sleep 12
          curl -sf "${{ vars.PROD_API_BASE_URL }}/health" || { echo "API health check failed"; exit 1; }
          echo "Deploy successful"
